<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 My Music Player</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Font Awesome for icons (optional but convenient) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <!-- Main Player Wrapper -->
    <div class="player-container">
        
        <!-- ========== NOW PLAYING ========== -->
        <div class="now-playing">
            <!-- Album Art -->
            <div class="album-art">
                <img src="assets/images/default-album.jpg" alt="Album Cover" id="albumCover" />
            </div>
            
            <!-- Song Info -->
            <div class="song-info">
                <h2 id="songTitle">Song Title</h2>
                <p id="artistName">Artist Name</p>
            </div>
            
            <!-- Progress Bar -->
            <div class="progress-container">
                <span class="time current" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <span class="time duration" id="duration">0:00</span>
            </div>
        </div>
        
        <!-- ========== PLAYER CONTROLS ========== -->
        <div class="controls">
            <!-- Shuffle -->
            <button class="control-btn" id="shuffleBtn" title="Shuffle">
                <i class="fas fa-random"></i>
            </button>
            <!-- Previous -->
            <button class="control-btn" id="prevBtn" title="Previous">
                <i class="fas fa-step-backward"></i>
            </button>
            <!-- Play / Pause (main) -->
            <button class="control-btn play-pause" id="playBtn" title="Play / Pause">
                <i class="fas fa-play"></i>
            </button>
            <!-- Next -->
            <button class="control-btn" id="nextBtn" title="Next">
                <i class="fas fa-step-forward"></i>
            </button>
            <!-- Repeat -->
            <button class="control-btn" id="repeatBtn" title="Repeat">
                <i class="fas fa-redo"></i>
            </button>
            <!-- Volume Control -->
            <div class="volume-control">
                <i class="fas fa-volume-up" id="volumeIcon"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
            </div>
        </div>
        
        <!-- ========== PLAYLIST ========== -->
        <div class="playlist-container">
            <div class="playlist-header">
                <h3>Playlist</h3>
                <button id="togglePlaylistBtn" class="toggle-btn">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            <ul class="playlist" id="playlist">
                <!-- Playlist items will be dynamically generated by JavaScript -->
                <!-- Example static entry for reference:
                <li class="playlist-item active" data-index="0">
                    <span class="playlist-song">Song Name</span>
                    <span class="playlist-artist">Artist</span>
                    <span class="playlist-duration">3:45</span>
                </li>
                -->
            </ul>
        </div>
    </div>
    
    <!-- ========== JAVASCRIPT ========== -->
    <script src="js/script.js"></script>
</body>
</html>
